<div class="login-page">
  <div class="login-card">
    <h1 class="brand">BoomVox</h1>

    <div class="tabs">
      <button [class.active]="activeTab === 'login'" (click)="switchTab('login')">Login</button>
      <button [class.active]="activeTab === 'register'" (click)="switchTab('register')">Register</button>
    </div>

    @if (error()) {
    <div class="error">{{ error() }}</div>
    }

    @if (activeTab() === 'login') {
    <form (ngSubmit)="onLogin()">
      <label>Email
        <input type="email" [(ngModel)]="loginData.email" name="email" required />
      </label>
      <label>Password
        <input type="password" [(ngModel)]="loginData.password" name="password" required />
      </label>
      <button type="submit" [disabled]="loading">
        {{ loading() ? 'Logging in…' : 'Login' }}
      </button>
    </form>
    }

    @if (activeTab() === 'register') {
    <form (ngSubmit)="onRegister()">
      <label>Username
        <input type="text" [(ngModel)]="registerData.username" name="username" required />
      </label>
      <label>First Name
        <input type="text" [(ngModel)]="registerData.firstName" name="firstName" required />
      </label>
      <label>Last Name
        <input type="text" [(ngModel)]="registerData.lastName" name="lastName" required />
      </label>
      <label>Email
        <input type="email" [(ngModel)]="registerData.email" name="email" required />
      </label>
      <label>Password
        <input type="password" [(ngModel)]="registerData.password" name="password" required />
      </label>
      <button type="submit" [disabled]="loading">
        {{ loading() ? 'Registering…' : 'Register' }}
      </button>
    </form>
    }
  </div>
</div>
